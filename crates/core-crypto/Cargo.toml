[package]
name = "core-crypto"
description = "Argon2id key derivation, AEAD encryption, and device key wrapping."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"
uuid = "1.29.3"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.8.1"

[lints]
workspace = true
