version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      rust:
        patterns:
          - "*"
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    # The Rust version is pinned by the action's toolchain input, not by the
    # action tag; a tag bump would install a nonexistent toolchain.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    labels:
      - dependencies
