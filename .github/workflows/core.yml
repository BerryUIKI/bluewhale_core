name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  windows:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Check licenses, advisories, bans, and sources
        run: cargo deny check

  contracts:
    name: Contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install contract tooling
        run: >-
          python -m pip install --disable-pip-version-check
          jsonschema==4.26.0
          PyYAML==6.0.4
          openapi-spec-validator==0.7.2
      - name: Check contracts
        run: python -I scripts/check_contracts.py

  coverage:
    name: Coverage gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure and enforce coverage
        run: |
          cargo +nightly llvm-cov --workspace --branch --json --output-path coverage.json
          python3 scripts/check_coverage.py coverage.json --branch
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: coverage.json
          retention-days: 14
